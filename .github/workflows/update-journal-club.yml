name: Update Journal Club

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD issue date for a daily backfill"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journal-club-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import daily arXiv papers
        if: github.event_name != 'push'
        env:
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            python scripts/update_arxiv.py --date "$BACKFILL_DATE"
          else
            python scripts/update_arxiv.py
          fi

      - name: Commit updated archive
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Archive is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update Journal Club arXiv archive"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
