name: Update Journal Club

on:
  push:
    branches:
      - main
  schedule:
    # Avoid the top-of-hour GitHub Actions congestion window.
    - cron: "17,32,47 7 * * 1-5"
    # Additional recovery opportunities if GitHub drops or delays the first group.
    - cron: "2,17 8 * * 1-5"
  workflow_dispatch:
    inputs:
      date:
        description: "Optional YYYY-MM-DD issue date for a daily backfill"
        required: false
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: journal-club-pages
  cancel-in-progress: false

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Import daily arXiv papers
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          BACKFILL_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$BACKFILL_DATE" ]; then
            python scripts/update_arxiv.py --date "$BACKFILL_DATE"
          else
            python scripts/update_arxiv.py
          fi

      - name: Repair recently missed weekdays
        if: github.event_name != 'push' && inputs.date == ''
        run: |
          for days_ago in 1 2 3 4 5 6 7; do
            issue_date="$(date -u -d "$days_ago days ago" +%F)"
            weekday="$(date -u -d "$issue_date" +%u)"
            if [ "$weekday" -le 5 ] && [ ! -f "data/dates/$issue_date.json" ]; then
              echo "Repairing missing Journal Club issue $issue_date"
              if ! python scripts/update_arxiv.py --date "$issue_date"; then
                echo "::warning::Could not repair $issue_date yet; a later run will retry."
              fi
            fi
          done

      - name: Commit updated archive
        if: github.event_name != 'push'
        run: |
          if [ -z "$(git status --porcelain -- data)" ]; then
            echo "Archive is already current."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data
            git commit -m "Update Journal Club arXiv archive"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: update-and-build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
