<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mask Comic</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@400;700;800;900&display=swap");

    :root {
      --ink: #24302f;
      --muted: #60706d;
      --paper: #fffdf8;
      --accent: #2f7f75;
      --shadow: rgba(37, 43, 41, 0.24);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Nunito", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 214, 146, 0.34), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(129, 199, 190, 0.28), transparent 30%),
        linear-gradient(135deg, #f8f4ea 0%, #e6f0ec 100%);
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 18px;
      padding: 22px;
    }

    header {
      align-items: end;
      display: flex;
      gap: 16px;
      justify-content: space-between;
      margin: 0 auto;
      width: min(1180px, 100%);
    }

    .home-link {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 800;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--accent);
    }

    h1 {
      font-family: "Comic Neue", "Nunito", "Trebuchet MS", system-ui, sans-serif;
      font-size: clamp(1.7rem, 5vw, 3.4rem);
      line-height: 0.95;
      margin: 6px 0 0;
    }

    .note {
      color: var(--muted);
      font-size: 0.95rem;
      font-weight: 800;
      margin: 0;
      text-align: right;
    }

    main {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .comic-frame {
      background: var(--paper);
      border: 2px solid rgba(36, 48, 47, 0.18);
      border-radius: 8px;
      box-shadow: 0 24px 44px var(--shadow);
      overflow: hidden;
      width: min(1180px, 100%);
    }

    .comic-frame img {
      display: block;
      height: auto;
      width: 100%;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      header {
        align-items: start;
        display: grid;
      }

      .note {
        text-align: left;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a class="home-link" href="../index.html">Illustrated Books</a>
      <h1>Mask Comic</h1>
    </div>
    <p class="note">A one-page comic about masking.</p>
  </header>

  <main>
    <figure class="comic-frame">
      <img src="Mask%20Comic%201.png" alt="A four-panel comic about masking in social and school situations.">
    </figure>
  </main>
</body>
</html>
