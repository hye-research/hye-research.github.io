<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Different Brains</title>
  <style>
    @import url("https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Ma+Shan+Zheng&family=Nunito:wght@400;700;800;900&display=swap");

    :root {
      color-scheme: light;
      --ink: #24302f;
      --muted: #60706d;
      --paper: #fffdf8;
      --accent: #2f7f75;
      --shadow: rgba(37, 43, 41, 0.26);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Nunito", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 18%, rgba(255, 214, 146, 0.34), transparent 28%),
        radial-gradient(circle at 86% 12%, rgba(129, 199, 190, 0.28), transparent 30%),
        linear-gradient(135deg, #f8f4ea 0%, #e6f0ec 100%);
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 18px;
      padding: 22px;
      overflow-x: hidden;
    }

    header,
    footer {
      width: min(1120px, 100%);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    h1 {
      margin: 0;
      font-family: "Comic Neue", "Nunito", "Trebuchet MS", system-ui, sans-serif;
      font-size: clamp(1.15rem, 2vw, 1.65rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: 0;
    }

    .page-count {
      color: var(--muted);
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .header-tools {
      align-items: center;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: flex-end;
    }

    .language-switch {
      display: flex;
      gap: 8px;
    }

    .language-switch button {
      min-width: 44px;
      min-height: 38px;
      border-radius: 999px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(34, 43, 40, 0.1);
    }

    .language-switch button.active {
      background: var(--accent);
      color: #fffdf8;
      border-color: rgba(36, 48, 47, 0.38);
    }

    .home-link {
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 700;
      text-decoration: none;
    }

    .home-link:hover {
      color: var(--accent);
    }

    main {
      display: grid;
      place-items: center;
      min-height: 0;
    }

    .book-stage {
      width: min(1120px, 100%);
      height: calc(100vh - 160px);
      min-height: 360px;
      display: grid;
      place-items: center;
      perspective: 2200px;
      overflow: auto;
      padding: 18px;
    }

    .book {
      position: relative;
      width: min(100%, 820px);
      aspect-ratio: 1448 / 1086;
      min-width: 280px;
      filter: drop-shadow(0 26px 42px var(--shadow));
    }

    .page {
      position: absolute;
      top: 0;
      width: 100%;
      height: 100%;
      background: var(--paper);
      overflow: hidden;
      backface-visibility: hidden;
      border: 1px solid rgba(54, 61, 58, 0.16);
      will-change: opacity, transform;
    }

    .page img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
      background: var(--paper);
      user-select: none;
      -webkit-user-drag: none;
    }

    .right-page {
      left: 0;
      right: 0;
      border-radius: 6px;
      box-shadow: inset 24px 0 30px rgba(45, 39, 31, 0.08);
    }

    .right-page.turn-next {
      animation: pageNext 340ms ease both;
    }

    .right-page.turn-prev {
      animation: pagePrev 340ms ease both;
    }

    .page-text {
      position: absolute;
      z-index: 5;
      top: 50%;
      right: 6.5%;
      width: 38%;
      max-height: 88%;
      overflow: hidden;
      padding: 0;
      border: 0;
      background: transparent;
      box-shadow: none;
      color: var(--ink);
      font-family: "Nunito", "Comic Neue", "Trebuchet MS", system-ui, sans-serif;
      font-size: clamp(0.9rem, 1.75vw, 1.28rem);
      font-weight: 800;
      line-height: 1.22;
      text-align: left;
      white-space: pre-wrap;
      text-wrap: balance;
      transform: translateY(-50%);
    }

    .page-text.zh-text {
      font-family: "Ma Shan Zheng", "Comic Neue", "Nunito", "Kaiti SC", "STKaiti", cursive, sans-serif;
      font-weight: 400;
      letter-spacing: 0.01em;
      line-height: 1.3;
    }

    .page-text:empty {
      display: none;
    }

    @keyframes pageNext {
      0% {
        opacity: 0;
        transform: translateX(18px) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    @keyframes pagePrev {
      0% {
        opacity: 0;
        transform: translateX(-18px) scale(0.992);
      }
      100% {
        opacity: 1;
        transform: translateX(0) scale(1);
      }
    }

    .controls,
    .zoom-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    button {
      min-width: 44px;
      min-height: 44px;
      border: 1px solid rgba(39, 47, 45, 0.2);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.72);
      color: var(--ink);
      font: inherit;
      cursor: pointer;
      display: grid;
      place-items: center;
      box-shadow: 0 10px 24px rgba(34, 43, 40, 0.11);
    }

    button:hover {
      border-color: rgba(47, 127, 117, 0.55);
      background: white;
    }

    button:disabled {
      cursor: default;
      opacity: 0.42;
      box-shadow: none;
    }

    .progress {
      width: min(520px, 42vw);
      height: 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.56);
      overflow: hidden;
      border: 1px solid rgba(39, 47, 45, 0.1);
    }

    .progress span {
      display: block;
      width: 0%;
      height: 100%;
      border-radius: inherit;
      background: var(--accent);
      transition: width 260ms ease;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
        gap: 12px;
      }

      header,
      footer {
        flex-wrap: wrap;
        align-items: flex-start;
      }

      footer {
        align-items: center;
      }

      .book-stage {
        width: 100%;
        height: calc(100vh - 150px);
        min-height: 0;
        padding: 8px;
      }

      .book {
        width: min(100%, 520px);
        aspect-ratio: 1448 / 1086;
      }

      .progress {
        order: 3;
        width: 100%;
      }

      .page-text {
        top: 50%;
        right: 5.5%;
        width: 40%;
        max-height: 86%;
        font-size: clamp(0.62rem, 2.3vw, 0.95rem);
        line-height: 1.16;
      }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <a class="home-link" href="../index.html">Illustrated Books</a>
      <h1>Different Brains</h1>
    </div>
    <div class="header-tools">
      <div class="language-switch" aria-label="Language">
        <button type="button" class="language-button active" data-language="en" aria-pressed="true">EN</button>
        <button type="button" class="language-button" data-language="zh" aria-pressed="false">中文</button>
      </div>
      <div class="page-count" aria-live="polite"></div>
    </div>
  </header>

  <main>
    <section class="book-stage" aria-label="Illustrated book">
      <div class="book">
        <div class="page right-page">
          <img alt="">
          <div class="page-text" aria-live="polite"></div>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <div class="controls">
      <button type="button" class="prev" aria-label="Previous page">‹</button>
      <button type="button" class="next" aria-label="Next page">›</button>
    </div>
    <div class="zoom-controls">
      <button type="button" class="zoom-out" aria-label="Zoom out">−</button>
      <button type="button" class="zoom-reset" aria-label="Reset zoom">100%</button>
      <button type="button" class="zoom-in" aria-label="Zoom in">+</button>
    </div>
    <div class="progress" aria-hidden="true"><span></span></div>
  </footer>

  <script>
    const pages = [
      "Page 1.png",
      "Page 2.png",
      "Page 3.png",
      "Page 4.png",
      "Page 5.png",
      "Page 6.png",
      "Page 7.png",
      "Page 8.png",
      "Page 9.png",
      "Page 10.png",
      "Page 11.png",
      "Page 12.png",
      "Page 13.png"
    ];

    const pageTexts = {
      en: [
      "Some brains fizz with ideas.\n\nOne spark, then another.\nUntil a little firework show\nbursts inside their heads.",
      "Some brains are brilliant\nat noticing tiny sounds.\n\nBefore anyone else hears a thing,\nthey are already looking up.\n\n“Wait… what was that?”",
      "Some brains do not always\nthink in words.\n\nThey think in pictures, colours and shapes,\nor in a little tune\nplaying softly in the background.",
      "Some brains need time to answer.\n\nThey search somewhere deep inside\nand bring their thoughts up slowly.\n\nThere is no need to rush.\nThey are still thinking.",
      "Some brains notice every sensation\nwith remarkable clarity.\n\nA light can feel dazzling.\nA sound can rush in all at once.\nEven a tiny clothing tag\nrefuses to be ignored.\n\n“Hmm… did someone turn\nthe whole world up today?”",
      "Some brains feel better\nwhen the body gets to move.\n\nA sway, a turn,\nsomething lovely to hold.\n\nThey are not trying to be restless.\nTheir body is simply saying,\n\n“Ahh. That feels better.”",
      "Some brains love knowing\nwhat comes next.\n\nFirst this, then that.\nAhh. Everything feels steadier.\n\nBut when the plan suddenly changes,\nthey may wonder,\n\n“Wait… where did my familiar path go?”\n\nThey may need a little time\nto look at the map again.",
      "Other brains love not knowing\nwhat comes next.\n\nA little door opens.\nThere is light inside.\n\n“Shall we take a look?”\n\nMaybe just one peek first.",
      "Some brains learn by looking.\nSome by listening.\nSome need to try it for themselves.\n\nAnd then, suddenly:\n\n“Oh! Now I get it!”\n\nEvery brain has\nits own way of learning.",
      "Some brains light up\nwhen they find something they love.\n\nThey want to know more,\nthen a little more,\nand perhaps just a little more after that.\n\nIt is not “too much.”\nIt is a brain glowing.",
      "Some brains experience feelings\nwith extraordinary intensity.\n\nJoy can flood the whole sky\nwith sunshine.\n\nSadness can feel\nlike rain inside the chest.\n\nThis brain is not being dramatic.\nIt simply feels things deeply.",
      "Every brain has things\nthat help it feel more at ease.\n\nA quiet corner.\nA pair of headphones.\nA soft cushion.\nA little more time.\n\nSometimes it also helps to say:\n\n“I need a break.”\n\nWith the right support,\na brain can breathe a little easier.",
      "There is no single\nabsolutely “right” kind of brain.\n\nSome are like fireworks.\nSome are like magnifying glasses.\nSome are like songs.\nSome are like maps unfolding slowly.\n\nThey notice different things,\nfollow different paths,\nand make sense of the world\nin different ways.\n\nAnd the world is richer\nbecause it is filled with all kinds of brains.\n\nWelcome to the world of different brains.\n\nYes, you are part of it, too."
      ],
      zh: [
        "有些大脑呀，\n灵感一来，噼里啪啦的，\n像脑袋里放起了小烟花。",
        "有些大脑特别会发现小动静。\n\n别人都没听见，\n它已经悄悄抬起头了：\n\n“咦？刚刚是不是有个声音？”",
        "还有些大脑不太用“语言”想事情。\n\n它们更喜欢用画面、颜色、形状，\n有时候，甚至是一小段旋律。",
        "有些大脑不会马上回答。\n\n它要安静一下，\n到脑袋深处找一找，\n再把答案慢慢捞上来。\n\n别着急。\n它还在想呢。",
        "有些大脑，\n会把周围的一切都感觉得清清楚楚。\n\n灯光亮得晃眼，\n声音一下子挤过来，\n衣服上的小标签也蹭呀蹭，怎么都躲不开。\n\n“唔……今天的世界，\n是不是把音量开得太大了？”",
        "也有些大脑，\n要让身体动一动，才会舒服。\n\n晃一晃，转一转，\n手里再摸点喜欢的东西。\n\n不是故意停不下来啦。\n身体只是在说：\n\n“嗯，这样好多了。”",
        "有些大脑喜欢知道\n接下来会发生什么。\n\n先做这个，再做那个。\n嗯，心里一下子踏实多了。\n\n可计划突然一变，\n它可能会想：\n\n“咦？我熟悉的那条路呢？”\n\n它可能需要一点时间，\n重新看看地图。",
        "还有些大脑，\n偏偏喜欢不知道下一秒会发生什么。\n\n一扇小门开了一点点。\n里面有光。\n\n“要不要进去看看？”\n\n嘿，先看一眼再说。",
        "有些大脑喜欢看，\n有些喜欢听，\n有些要亲手试一试。\n\n然后突然：\n\n“啊，我懂了！”\n\n每个大脑，\n都有自己的学习路线。",
        "有些大脑一碰到喜欢的东西，\n眼睛就“唰”地亮起来。\n\n想知道更多，\n再多一点，\n还可以再多一点！\n\n不是“太过头”啦。\n是大脑在发光。",
        "有些大脑，\n会把每一种感觉都感受得特别浓。\n\n开心的时候，\n像太阳“哗”地铺满整片天空。\n\n难过的时候，\n心里也真的会下起雨。\n\n这个大脑不是太夸张。\n它只是感受得很深、很认真。",
        "每个大脑，\n都有适合自己的小帮手。\n\n安静的角落，\n一副耳机，\n软软的抱枕，\n或者一点点时间。\n\n有时候，也可以直接说：\n\n“我想休息一下。”\n\n找到适合自己的方法，\n大脑就能松一口气啦。",
        "世界上没有哪一种大脑，\n才是“绝对正确的大脑”。\n\n有的大脑像烟花，\n有的像放大镜，\n有的像一首歌，\n有的像慢慢展开的地图。\n\n它们看见不同的东西，\n走不同的路，\n用不同的方式认识这个世界。\n\n而这个世界，\n正好需要各种各样的大脑。\n\n欢迎来到不一样的大脑世界。\n\n嗯，你也在这里。"
      ]
    };

    const book = document.querySelector(".book");
    const bookStage = document.querySelector(".book-stage");
    const activePage = document.querySelector(".right-page");
    const rightPage = document.querySelector(".right-page img");
    const prevButton = document.querySelector(".prev");
    const nextButton = document.querySelector(".next");
    const zoomOutButton = document.querySelector(".zoom-out");
    const zoomInButton = document.querySelector(".zoom-in");
    const zoomResetButton = document.querySelector(".zoom-reset");
    const pageText = document.querySelector(".page-text");
    const pageCount = document.querySelector(".page-count");
    const progress = document.querySelector(".progress span");
    const languageButtons = document.querySelectorAll(".language-button");

    let spread = 0;
    let busy = false;
    let zoom = 1;
    let language = localStorage.getItem("different-brains-language") === "zh" ? "zh" : "en";

    pages.forEach((src) => {
      const image = new Image();
      image.src = src;
    });

    function setImage(image, index) {
      image.src = pages[index];
      image.alt = `Page ${index + 1}`;
    }

    function renderPageText() {
      pageText.textContent = pageTexts[language][spread] || "";
      pageText.classList.toggle("zh-text", language === "zh");
    }

    function renderLanguage() {
      languageButtons.forEach((button) => {
        const isActive = button.dataset.language === language;
        button.classList.toggle("active", isActive);
        button.setAttribute("aria-pressed", String(isActive));
      });
      document.documentElement.lang = language === "zh" ? "zh-Hans" : "en";
    }

    function render() {
      setImage(rightPage, spread);
      prevButton.disabled = spread === 0 || busy;
      nextButton.disabled = spread >= pages.length - 1 || busy;
      pageCount.textContent = `${spread + 1} / ${pages.length}`;
      progress.style.width = `${((spread + 1) / pages.length) * 100}%`;
      renderLanguage();
      renderPageText();
    }

    function updateZoom(nextZoom) {
      zoom = Math.min(2.6, Math.max(0.55, nextZoom));
      const stageStyle = getComputedStyle(bookStage);
      const stagePaddingX = parseFloat(stageStyle.paddingLeft) + parseFloat(stageStyle.paddingRight);
      const stagePaddingY = parseFloat(stageStyle.paddingTop) + parseFloat(stageStyle.paddingBottom);
      const availableWidth = Math.max(280, bookStage.clientWidth - stagePaddingX);
      const availableHeight = Math.max(210, bookStage.clientHeight - stagePaddingY);
      const pageAspect = 1448 / 1086;
      const fittedWidth = Math.min(availableWidth, availableHeight * pageAspect);
      book.style.width = `${Math.max(280, fittedWidth * zoom)}px`;
      zoomResetButton.textContent = `${Math.round(zoom * 100)}%`;
      zoomOutButton.disabled = zoom <= 0.56;
      zoomInButton.disabled = zoom >= 2.59;
    }

    function next() {
      if (busy || spread >= pages.length - 1) return;
      busy = true;
      spread = Math.min(spread + 1, pages.length - 1);
      activePage.classList.remove("turn-next", "turn-prev");
      void activePage.offsetWidth;
      activePage.classList.add("turn-next");
      render();
    }

    function previous() {
      if (busy || spread === 0) return;
      busy = true;
      spread = Math.max(spread - 1, 0);
      activePage.classList.remove("turn-next", "turn-prev");
      void activePage.offsetWidth;
      activePage.classList.add("turn-prev");
      render();
    }

    nextButton.addEventListener("click", next);
    prevButton.addEventListener("click", previous);
    activePage.addEventListener("animationend", () => {
      activePage.classList.remove("turn-next", "turn-prev");
      busy = false;
      render();
    });
    zoomOutButton.addEventListener("click", () => updateZoom(zoom - 0.15));
    zoomInButton.addEventListener("click", () => updateZoom(zoom + 0.15));
    zoomResetButton.addEventListener("click", () => updateZoom(1));
    languageButtons.forEach((button) => {
      button.addEventListener("click", () => {
        language = button.dataset.language;
        localStorage.setItem("different-brains-language", language);
        render();
      });
    });
    book.addEventListener("wheel", (event) => {
      if (!event.ctrlKey && !event.metaKey) return;
      event.preventDefault();
      updateZoom(zoom + (event.deltaY < 0 ? 0.12 : -0.12));
    }, { passive: false });
    book.addEventListener("click", (event) => {
      const rect = book.getBoundingClientRect();
      if (event.clientX - rect.left > rect.width / 2) {
        next();
      } else {
        previous();
      }
    });
    window.addEventListener("keydown", (event) => {
      if (event.key === "ArrowRight") next();
      if (event.key === "ArrowLeft") previous();
      if (event.key === "=" || event.key === "+") updateZoom(zoom + 0.15);
      if (event.key === "-") updateZoom(zoom - 0.15);
      if (event.key === "0") updateZoom(1);
    });
    window.addEventListener("resize", () => {
      updateZoom(zoom);
      render();
    });

    updateZoom(1);
    render();
  </script>
</body>
</html>
